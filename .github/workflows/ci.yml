name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
  workflow-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r workflow-gateway/requirements.txt
      - run: python -m compileall -q workflow-gateway
      - run: python -m unittest discover -s workflow-gateway/tests -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
